# ---------------------------------------------------------------------------
# Optional convenience compose file for the prototype.
#
# The backend uses SQLite by default and needs no external DB to run, so
# this file is intentionally minimal — it just containerizes the two apps.
# A commented-out Postgres service is included for when you outgrow SQLite.
# ---------------------------------------------------------------------------
version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

